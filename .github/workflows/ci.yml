name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every gate here is blocking. Constitution, Merge Rules: never merge on red.
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # PostgreSQL 16 deliberately — the version the null-safe predicate rule was
      # reproduced against (Constitution v1.3.0).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lc_migration
          POSTGRES_PASSWORD: lc_migration_ci
          POSTGRES_DB: legalconnect
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lc_migration -d legalconnect"
          --health-interval 5s --health-timeout 5s --health-retries 12

    env:
      DATABASE_URL_MIGRATION: postgresql://lc_migration:lc_migration_ci@localhost:5432/legalconnect
      DATABASE_URL_APP: postgresql://lc_app:lc_app_ci@localhost:5432/legalconnect
      DATABASE_URL_PLATFORM: postgresql://lc_platform:lc_platform_ci@localhost:5432/legalconnect
      DATABASE_URL_RETENTION: postgresql://lc_retention:lc_retention_ci@localhost:5432/legalconnect
      # 003's fifth role. lc_auth is the only role holding grants on the three
      # authentication-material tables; lc_app holds none at all. The lockdown suite
      # connects as this role for real rather than as the owner, so CI needs it.
      DATABASE_URL_AUTH: postgresql://lc_auth:lc_auth_ci@localhost:5432/legalconnect
      LC_APP_PASSWORD: lc_app_ci
      LC_PLATFORM_PASSWORD: lc_platform_ci
      LC_RETENTION_PASSWORD: lc_retention_ci
      LC_AUTH_PASSWORD: lc_auth_ci
      PORT: '3000'
      # 001's deployment constraint: the platform surface authenticates nothing before
      # slice 003, so it binds to loopback. CI sets it explicitly rather than relying on
      # main.ts's default, so the value under test is the value documented.
      PLATFORM_BIND_HOST: 127.0.0.1
      # Added to `.env.example` by 018's CORS fix and never copied here. It went unnoticed for
      # a month because this job died at "Initialize containers" before reaching check:env.
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Every key `.env.example` declares must be set here — `check:env` below asserts
      # exactly that, so CI proves the documented set is sufficient to run the
      # application rather than merely that a developer's own `.env` happens to work.
      OBJECT_STORE_ENDPOINT: http://localhost:9000
      OBJECT_STORE_REGION: us-east-1
      OBJECT_STORE_BUCKET: legalconnect-documents-ci
      OBJECT_STORE_ACCESS_KEY_ID: lc_minio_ci
      OBJECT_STORE_SECRET_ACCESS_KEY: lc_minio_ci_password
      OBJECT_STORE_FORCE_PATH_STYLE: 'true'
      EMAIL_PROVIDER_REGION: us-east-1
      EMAIL_SENDER_ADDRESS: no-reply@legalconnect.mx
      INVITATION_MAX_FAILED_ATTEMPTS: '10'
      # Deliberately well above the code default of 50. The full suite issues more than
      # that against one seeded tenant, and the cap is 002's own rate limit doing its job
      # — not something a CI run should trip over.
      INVITATION_ISSUANCE_RATE_PER_HOUR: '2000'
      # 003's parameters. Every one is a PARAMETER, NOT A SWITCH: none can disable
      # enrollment or the challenge, and mfa-no-disable-path.test.ts asserts that
      # exhaustively over this whole set rather than by sampling (FR-007, SC-004).
      #
      # The local key provider is correct HERE and refused in any deployed
      # environment by main.ts's startup assertion — CI is not a deployment.
      AUTH_KEY_PROVIDER: local
      AUTH_LOCAL_KEY: ZGV2LW9ubHktMzItYnl0ZS1rZXktbm90LXNlY3JldCE=
      AUTH_KMS_KEY_ID: ''
      AUTH_LOCKOUT_THRESHOLD: '5'
      AUTH_LOCKOUT_MINUTES: '15'
      AUTH_BACKUP_CODE_COUNT: '10'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # 007-document-management, research.md D6. The document suites exercise real
      # S3-API behaviour — signing, expiry, cross-tenant pre-signed URL isolation —
      # against MinIO rather than a mock, so CI needs the same service local dev runs.
      #
      # A STEP, NOT A `services:` CONTAINER, and pinned on quay.io — both forced, not chosen.
      # `minio/minio` no longer exists on Docker Hub: from the merge of 005 onward every
      # run died at "Initialize containers" with "pull access denied", before checkout, so
      # main was red and not one backend test ran. The old `edge-cicd` tag existed only
      # because it starts `server /data` by default; the standard image needs that argument,
      # and GitHub's `services:` block cannot pass one. It also no longer ships `curl`, so
      # health is polled from the runner instead of from inside the container.
      - name: Start the object store
        run: |
          docker run -d --name lc-minio -p 9000:9000             -e MINIO_ROOT_USER=lc_minio_ci -e MINIO_ROOT_PASSWORD=lc_minio_ci_password             quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          docker logs lc-minio
          exit 1

      # Creates the bucket the application expects. MinIO comes up HEALTHY with no bucket
      # in it, and every upload then fails with a 500 that looks like application code.
      # Uses the `mc` shipped inside the MinIO image rather than downloading a binary.
      - name: Create the object-store bucket
        run: |
          docker exec lc-minio mc alias set ci http://localhost:9000 lc_minio_ci lc_minio_ci_password
          docker exec lc-minio mc mb --ignore-existing ci/legalconnect-documents-ci

      # Leads the quality gates because a drifted environment makes every gate below it
      # fail for reasons that have nothing to do with the code — three separate incidents
      # in this repository, each a key present in `.env.example` and absent from the
      # environment actually running. See scripts/check-env-example.mjs.
      - name: Environment matches .env.example
        run: npm run check:env

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Migrate
        run: npm run db:migrate

      - name: Seed
        run: npm run db:seed

      # The role check leads deliberately. If it fails, every gate below it would pass
      # while proving nothing.
      - name: Application role is not superuser, owns nothing, lacks BYPASSRLS
        run: npm run verify:role

      - name: RLS coverage — every tenant-scoped table has a null-safe policy
        run: npm run test:rls

      - name: Cross-tenant leak suite (includes the no-context case)
        run: npm run test:isolation

      # 003/T097, SC-029. ON THE SAME FOOTING AS TENANT ISOLATION — a failure
      # blocks the merge, and the four run as their own step rather than being
      # discharged by the full suite below.
      #
      # The constitution asks for that explicitly: "authentication is covered"
      # IN AGGREGATE does not satisfy it, because each of these is a single
      # misconfiguration that leaves every other test green while the protection
      # is absent. That is the property that put tenant isolation on the list,
      # and it is why this step sits beside it rather than inside `npm test`.
      #
      #   mfa-enforcement      — a second factor is demanded on 100% of sign-ins
      #   mfa-no-disable-path  — no configuration value can switch it off
      #   backup-codes         — issuance, single use, and no way to read them back
      #   totp-secret-custody  — a dump without the key yields no working factor
      - name: Blocking authentication coverage (SC-029)
        run: npm run test:auth-coverage

      - name: Full suite with blocking coverage
        run: npm test -- --coverage

  # 003. THE FRONTEND HAD NO CI AT ALL until this slice.
  #
  # 016a, 018 and 019 shipped with Playwright specs, component tests and unit
  # tests that nothing ever ran: the `quality` job above is entirely
  # `working-directory: backend`. Merge Rules say "never merge on red", and you
  # cannot be green on something that is not executed.
  #
  # 003 is what makes it urgent rather than merely overdue: this slice puts the
  # sign-in, challenge, enrollment and recovery screens in the browser, and
  # FR-051's "nothing reaches browser storage" is a frontend property that only
  # a frontend test can hold.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    env:
      # A throwaway for the build and the test run. Rotating it signs everyone
      # out and loses nothing else: the API's session rows decide validity.
      NEXTAUTH_SECRET: ci-only-secret-not-a-real-one
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:3001

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and component tests
        run: npm test

      # The build is its own gate. A page that type-checks can still fail to
      # render — a client hook in a server component, a missing Suspense
      # boundary around useSearchParams — and every one of those is a screen
      # that 500s in production while every test above passes.
      - name: Production build
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Principle VI: blocking secret scanning. Secrets never in the repository,
      # never in logs, never in error messages.
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Principle VI: "dependency vulnerability scanning in CI. No critical CVEs on
  # main." Until 003 this ran only against `backend/`, so Next, React and the
  # ~40 Radix packages the frontend carries were never scanned at all. The
  # matrix closes that.
  dependency-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      # No critical CVEs on main.
      - run: npm audit --audit-level=critical
